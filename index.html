<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seahawks Playoff Impact Dashboard</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            color: #002244;
            background-color: #69BE28;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 24px;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #a0a0a0;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .refresh-btn {
            display: block;
            width: 220px;
            margin: 0 auto 25px auto;
            background-color: #002244;
            color: #fff;
            border: 2px solid #69BE28;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.3s;
        }
        .refresh-btn:hover {
            background-color: #003366;
        }
        .dashboard-status {
            text-align: center;
            font-size: 12px;
            color: #888;
            margin-top: -15px;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #2d2d2d;
        }
        th {
            background-color: #002244;
            color: #69BE28;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.5px;
        }
        tr:last-child td {
            border-bottom: none;
        }
        .matchup {
            font-weight: bold;
            font-size: 16px;
            color: #fff;
        }
        .impact {
            font-size: 14px;
            color: #cccccc;
            line-height: 1.4;
        }
        .score-box {
            font-family: "Courier New", Courier, monospace;
            font-weight: bold;
            font-size: 15px;
            color: #69BE28;
        }
        .indicator {
            font-weight: bold;
            font-size: 14px;
            text-align: center;
        }
        .good { color: #69BE28; }
        .bad { color: #e53935; }
        .mixed { color: #ffb300; }
        .neutral { color: #29b6f6; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🦅 Seattle Seahawks Playoff Impact Dashboard</h1>
        <div class="subtitle">Live-updating template tracking games of consequence to Seattle's (3-3) postseason position</div>
        
        <button class="refresh-btn" onclick="updateScores()">🔄 Refresh Scores</button>
        <div id="status" class="dashboard-status">Loading latest live scores from network...</div>

        <table>
            <thead>
                <tr>
                    <th style="width: 25%;">Matchup</th>
                    <th style="width: 40%;">Significance & Scenario Impact</th>
                    <th style="width: 20%;">Live Score / Status</th>
                    <th style="width: 15%; text-align: center;">Indicator</th>
                </tr>
            </thead>
            <tbody id="dashboard-rows">
                <!-- Dynamic rows injected by JavaScript -->
            </tbody>
        </table>
    </div>

    <script>
        // Target games with specific teams affecting the Seahawks' playoff hunt
        const trackedGames = [
            {
                home: "Falcons", away: "Bears",
                impact: "<strong>High Significance:</strong> Direct Wild Card competition. A Bears loss stalls their vertical push over Seattle.",
                goodIfWin: "Falcons", badIfWin: "Bears", isMixed: false
            },
            {
                home: "Eagles", away: "Panthers",
                impact: "<strong>Moderate Significance:</strong> Capping Wild Card expansion. Keeping Philadelphia pinned at 4 losses benefits Seattle long-term.",
                goodIfWin: "Panthers", badIfWin: "Eagles", isMixed: true // Tighter wild card cluster vs slowing a frontrunner
            },
            {
                home: "Giants", away: "Saints",
                impact: "<strong>Moderate Significance:</strong> Deflate New York's 3-1-1 headstart to bring them back down closer to the 3-win Wild Card floor.",
                goodIfWin: "Saints", badIfWin: "Giants", isMixed: false
            },
            {
                home: "Rams", away: "Cardinals",
                impact: "<strong>High Significance:</strong> Direct NFC West alignment. A Los Angeles victory creates a tie with Seattle; a Cardinals win protects the division floor.",
                goodIfWin: "Cardinals", badIfWin: "Rams", isMixed: false
            },
            {
                home: "Packers", away: "Cowboys",
                impact: "<strong>High Significance:</strong> Primary conference leverage match. Green Bay sits above Seattle, while Dallas trails right behind.",
                goodIfWin: "Cowboys", badIfWin: "Packers", isMixed: false
            },
            {
                home: "49ers", away: "Commanders",
                impact: "<strong>Low/Moderate Significance:</strong> Divisional leadership. While catching the undefeated 49ers is a long shot, early conference losses add up.",
                goodIfWin: "Commanders", badIfWin: "49ers", isMixed: false
            }
        ];

        async function updateScores() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = "Fetching live game data...";
            
            try {
                // Fetching from ESPN's hidden scoreboard endpoint
                const response = await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard');
                const data = await response.json();
                const events = data.events || [];
                
                const tbody = document.getElementById('dashboard-rows');
                tbody.innerHTML = ''; // Clear fallback rows
                
                trackedGames.forEach(tg => {
                    // Search for a matching match in ESPN's feed
                    const gameData = events.find(e => {
                        const name = e.name.toLowerCase();
                        return name.includes(tg.home.toLowerCase()) && name.includes(tg.away.toLowerCase());
                    });
                    
                    let scoreDisplay = "Not Started";
                    let indicatorHtml = `<span class="neutral">⌛ Upcoming</span>`;
                    
                    if (gameData) {
                        const status = gameData.status.type.detail;
                        const state = gameData.status.type.state; // "pre", "in", "post"
                        const competitors = gameData.competitions[0].competitors;
                        
                        const homeTeam = competitors.find(c => c.homeAway === 'home');
                        const awayTeam = competitors.find(c => c.homeAway === 'away');
                        
                        const homeScore = parseInt(homeTeam.score);
                        const awayScore = parseInt(awayTeam.score);
                        
                        const homeName = homeTeam.team.name;
                        const awayName = awayTeam.team.name;
                        
                        if (state !== 'pre') {
                            scoreDisplay = `${awayName} ${awayScore}<br>${homeName} ${homeScore}<br><span style="font-size:12px; color:#aaa;">${status}</span>`;
                            
                            // Determine leader/winner
                            let leader = null;
                            if (awayScore > homeScore) leader = tg.away;
                            else if (homeScore > awayScore) leader = tg.home;
                            
                            if (leader) {
                                if (leader === tg.goodIfWin) {
                                    indicatorHtml = `<span class="good">👍 Good</span>`;
                                } else if (leader === tg.badIfWin) {
                                    indicatorHtml = `<span class="bad">❌ Bad</span>`;
                                } else if (tg.isMixed) {
                                    indicatorHtml = `<span class="mixed">⚠️ Mixed</span>`;
                                }
                            } else {
                                scoreDisplay += "<br>(Tie)";
                                indicatorHtml = `<span class="mixed">⚠️ Tied</span>`;
                            }
                        } else {
                            // If pre-game, parse the date string elegantly
                            scoreDisplay = status;
                            indicatorHtml = `<span class="neutral">🦅 Root for ${tg.goodIfWin}</span>`;
                        }
                    } else {
                        scoreDisplay = "Scheduled<br><span style='font-size:11px; color:#777;'>Feed pending</span>";
                        indicatorHtml = `<span class="neutral">🦅 Root for ${tg.goodIfWin}</span>`;
                    }
                    
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td class="matchup">${tg.away} @ ${tg.home}</td>
                        <td class="impact">${tg.impact}</td>
                        <td class="score-box">${scoreDisplay}</td>
                        <td class="indicator">${indicatorHtml}</td>
                    `;
                    tbody.appendChild(row);
                });
                
                const now = new Date();
                statusDiv.innerText = "Last updated: " + now.toLocaleTimeString();
                
            } catch (error) {
                console.error("Error loading scoreboard:", error);
                statusDiv.innerText = "Error syncing live scoreboard. Click refresh to try again.";
            }
        }

        // Initialize scoreboard on window load
        window.onload = updateScores;
    </script>
</body>
</html>
