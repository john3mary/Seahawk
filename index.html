<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seahawks Playoff Impact Dashboard</title>
    <style>
        :root {
            --seahawks-blue: #002244;
            --seahawks-green: #69BE28;
            --seahawks-gray: #A5ACAF;
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        header {
            background-color: var(--seahawks-blue);
            padding: 20px;
            border-bottom: 4px solid var(--seahawks-green);
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        h1 { margin: 0; font-size: 24px; color: #fff; }
        .timestamp { font-size: 14px; color: var(--seahawks-gray); margin-top: 5px; }
        .refresh-btn {
            background-color: var(--seahawks-green);
            color: var(--seahawks-blue);
            border: none;
            padding: 10px 18px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .refresh-btn:hover { opacity: 0.9; }
        
        .summary-banner {
            background-color: #1a2536;
            border: 1px solid #2d3d52;
            border-radius: 6px;
            padding: 12px 20px;
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
            font-size: 15px;
        }
        .summary-title {
            font-weight: bold;
            color: var(--seahawks-green);
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.5px;
        }
        .summary-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0,0,0,0.2);
            padding: 4px 10px;
            border-radius: 4px;
        }
        
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 15px;
        }
        .game-card {
            background-color: var(--card-bg);
            border-left: 5px solid var(--seahawks-gray);
            border-radius: 6px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .game-card.consequential {
            border-left-color: var(--seahawks-green);
        }
        .game-status {
            font-size: 12px;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 10px;
            color: var(--seahawks-green);
        }
        .team-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 8px 0;
            font-size: 18px;
        }
        .team-name { font-weight: 500; }
        .team-score { font-weight: bold; font-family: monospace; font-size: 20px; }
        .team-row.winner { color: var(--seahawks-green); }
        
        .rooting-guide {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #333;
            font-size: 14px;
        }
        .indicator {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 8px;
            border-radius: 4px;
            line-height: 1.4;
        }
        .indicator.good {
            background-color: rgba(105, 190, 40, 0.15);
            border-left: 3px solid #69BE28;
            color: #fff;
        }
        .indicator.bad {
            background-color: rgba(231, 76, 60, 0.15);
            border-left: 3px solid #e74c3c;
            color: #fff;
        }
        .indicator.neutral {
            background-color: rgba(241, 196, 15, 0.15);
            border-left: 3px solid #f1c40f;
            color: #fff;
        }
        .indicator span {
            font-size: 16px;
            font-weight: bold;
        }
        
        .loading { font-size: 18px; text-align: center; margin: 20px 0; color: var(--seahawks-gray); }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>Seahawks Playoff Impact Dashboard</h1>
            <div class="timestamp" id="timestamp">Loading schedule...</div>
        </div>
        <button class="refresh-btn" onclick="fetchNFLGames()">Refresh Scores</button>
    </header>

    <div class="summary-banner" id="summary-banner" style="display: none;">
        <span class="summary-title">Today's Playoff Tracking Summary:</span>
        <div class="summary-badge" id="badge-seahawks">🟢 Seahawks: --</div>
        <div class="summary-badge" id="badge-rivals-fell">🔥 Rivals Knocked Down: 0</div>
        <div class="summary-badge" id="badge-rivals-survived">⚠️ Rivals Holding Ground: 0</div>
    </div>

    <div id="loading" class="loading">Fetching current live games from ESPN...</div>
    <div class="container" id="dashboard-container"></div>

    <script>
        const targetTeams = ["SF", "ARI", "LAR", "GB", "MIN", "DET", "PHI", "WSH", "ATL", "TB", "CHI"];
        
        const explicitRootingGuide = {
            "SF": { type: "bad", icon: "❌", text: "Root against 49ers. Any divisional loss drops their NFC West standing and opens a clean window for Seattle to take the division lead." },
            "ARI": { type: "bad", icon: "❌", text: "Root against Cardinals. Divisional losses damage their division record and clear the way for Seattle's tiebreaker advantages." },
            "LAR": { type: "bad", icon: "❌", text: "Root against Rams. Keeping divisional opponents down protects Seattle's inside track to host a home playoff game." },
            "GB": { type: "bad", icon: "❌", text: "Root against Packers. Green Bay is a primary competitor for a Wild Card slot; a loss hands Seattle a game up in the standings." },
            "MIN": { type: "bad", icon: "❌", text: "Root against Vikings. Restricting their total win count limits their Wild Card padding and helps tiebreaker margins down the road." },
            "DET": { type: "bad", icon: "❌", text: "Root against Lions. Keeping high-tier NFC seeds within striking distance expands Wild Card breathing room and conference positioning." },
            "PHI": { type: "bad", icon: "❌", text: "Root against Eagles. Philadelphia heavily impacts conference record tiebreakers; keeping them suppressed secures Seattle's leverage." },
            "WSH": { type: "bad", icon: "❌", text: "Root against Commanders. Washington is fighting closely for conference seed priority; a loss weakens their head-to-head metrics." },
            "CHI": { type: "bad", icon: "❌", text: "Root against Bears. Chicago sits directly on the Wild Card bubble; suppression knocks them down the bubble hierarchy." },
            "ATL": { type: "bad", icon: "❌", text: "Root against Falcons. Restricting division leaders controls the tiebreaker math for conference sorting down the line." },
            "TB": { type: "bad", icon: "❌", text: "Root against Buccaneers. Suppression directly cleans up tiebreaker strength-of-schedule clutter across the Wild Card board." }
        };

        async function fetchNFLGames() {
            const container = document.getElementById('dashboard-container');
            const loadingEl = document.getElementById('loading');
            const timestampEl = document.getElementById('timestamp');
            const bannerEl = document.getElementById('summary-banner');
            
            loadingEl.style.display = 'block';
            
            try {
                const response = await fetch('https://site.web.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard');
                const data = await response.json();
                
                container.innerHTML = '';
                loadingEl.style.display = 'none';
                
                const weekNum = data.week ? data.week.number : '';
                timestampEl.innerText = `NFL Week ${weekNum} | Last Checked: ${new Date().toLocaleTimeString()}`;

                const events = data.events || [];
                
                if (events.length === 0) {
                    container.innerHTML = '<div class="loading">No games found for this week.</div>';
                    bannerEl.style.display = 'none';
                    return;
                }

                let seahawksStatus = "No Game Scheduled";
                let targetsExtinguished = 0;
                let targetsSurvived = 0;

                events.forEach(event => {
                    const competition = event.competitions[0];
                    const competitors = competition.competitors;
                    
                    const homeTeam = competitors.find(c => c.homeAway === 'home');
                    const awayTeam = competitors.find(c => c.homeAway === 'away');
                    
                    const homeAbbrev = homeTeam.team.abbreviation;
                    const awayAbbrev = awayTeam.team.abbreviation;
                    
                    const isHomeTarget = targetTeams.includes(homeAbbrev);
                    const isAwayTarget = targetTeams.includes(awayAbbrev);
                    const isSeahawks = homeAbbrev === "SEA" || awayAbbrev === "SEA";
                    const isConsequential = isHomeTarget || isAwayTarget || isSeahawks;

                    if (!isConsequential) return;

                    const statusType = event.status.type.state; 
                    const statusDetail = event.status.type.detail;

                    let preferredWinnerAbbrev = null;
                    if (isHomeTarget && isAwayTarget) {
                        preferredWinnerAbbrev = (homeAbbrev === "SF" || homeAbbrev === "ARI" || homeAbbrev === "LAR") ? awayAbbrev : homeAbbrev;
                    } else if (isAwayTarget) {
                        preferredWinnerAbbrev = homeAbbrev;
                    } else if (isHomeTarget) {
                        preferredWinnerAbbrev = awayAbbrev;
                    }

                    if (isSeahawks) {
                        if (statusType === 'pre') seahawksStatus = "Scheduled";
                        else if (statusType === 'in') seahawksStatus = `Live (${statusDetail})`;
                        else if (statusType === 'post') {
                            const seaWon = (homeTeam.winner && homeAbbrev === "SEA") || (awayTeam.winner && awayAbbrev === "SEA");
                            seahawksStatus = seaWon ? "🎉 WON" : "❌ LOST";
                        }
                        
                        guideClass = "good";
                        guideIcon = "🟢";
                        guideText = "<strong>CRITICAL GAME: Root for the Seahawks! Winning secures our direct line to the postseason.</strong>";
                    } else {
                        if (statusType === 'post') {
                            const preferredWon = (homeTeam.winner && homeAbbrev === preferredWinnerAbbrev) || (awayTeam.winner && awayAbbrev === preferredWinnerAbbrev);
                            
                            if (preferredWon) {
                                targetsExtinguished++;
                                guideClass = "good";
                                guideIcon = "🟢";
                                guideText = `<strong>GREAT OUTCOME: Target team fell! This loss helps slide Seattle up in the playoff rankings hierarchy.</strong>`;
                            } else {
                                targetsSurvived++;
                                guideClass = "bad";
                                guideIcon = "❌";
                                guideText = `Target team won. Their record expansion forces tighter tiebreaker windows for Seattle's Wild Card positioning.`;
                            }
                        } else {
                            if (isHomeTarget && isAwayTarget) {
                                guideClass = "neutral";
                                guideIcon = "🟡";
                                guideText = `NFC Clash. Preferred target strategy: ${explicitRootingGuide[awayAbbrev].text}`;
                            } else if (isAwayTarget) {
                                guideClass = explicitRootingGuide[awayAbbrev].type;
                                guideIcon = explicitRootingGuide[awayAbbrev].icon;
                                guideText = explicitRootingGuide[awayAbbrev].text;
                            } else if (isHomeTarget) {
                                guideClass = explicitRootingGuide[homeAbbrev].type;
                                guideIcon = explicitRootingGuide[homeAbbrev].icon;
                                guideText = explicitRootingGuide[homeAbbrev].text;
                            }
                        }
                    }

                    const card = document.createElement('div');
                    card.className = `game-card ${isConsequential ? 'consequential' : ''}`;

                    const isHomeWinner = statusType === 'post' && homeTeam.winner;
                    const isAwayWinner = statusType === 'post' && awayTeam.winner;

                    card.innerHTML = `
                        <div class="game-status">${statusDetail}</div>
                        <div class="team-row ${isAwayWinner ? 'winner' : ''}">
                            <span class="team-name">${awayTeam.team.displayName} (${awayAbbrev})</span>
                            <span class="team-score">${statusType !== 'pre' ? awayTeam.score : ''}</span>
                        </div>
                        <div class="team-row ${isHomeWinner ? 'winner' : ''}">
                            <span class="team-name">${homeTeam.team.displayName} (${homeAbbrev})</span>
                            <span class="team-score">${statusType !== 'pre' ? homeTeam.score : ''}</span>
                        </div>
                        <div class="rooting-guide">
                            <div class="indicator ${guideClass}">
                                <span>${guideIcon}</span>
                                <div>${guideText}</div>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });

                document.getElementById('badge-seahawks').innerText = `🟢 Seahawks: ${seahawksStatus}`;
                document.getElementById('badge-rivals-fell').innerText = `🔥 Rivals Knocked Down: ${targetsExtinguished}`;
                document.getElementById('badge-rivals-survived').innerText = `⚠️ Rivals Holding Ground: ${targetsSurvived}`;
                bannerEl.style.display = 'flex';

            } catch (error) {
                console.error("Failed to parse data payload:", error);
                loadingEl.innerText = "Error loading current live data. Please try again shortly.";
                bannerEl.style.display = 'none';
            }
        }

        fetchNFLGames();
        setInterval(fetchNFLGames, 60000);
    </script>
</body>
</html>
